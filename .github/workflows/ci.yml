name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@619094ad54edc586f5c2733358e00326b30790bd
    with:
      # The old MSRV job ran `cargo test` at 1.85, not a bare build. The
      # default (`build`) would verify strictly less than CI already did, so
      # this carries the existing decision across rather than relaxing it.
      msrv-check: test
      # The repo's coverage gate is carried below VERBATIM instead of using the
      # shared one, because the two cannot be reconciled through a single
      # `all-features` input: the old test job runs `--all-features` while the
      # old coverage job deliberately does NOT. Measured both ways on this
      # tree with the shared workflow's own per-line rules:
      #   cargo llvm-cov --workspace                 --ignore-filename-regex '/tests/|/fuzz/'  -> 0 uncovered
      #   cargo llvm-cov --workspace --all-features  --ignore-filename-regex '/tests/|/fuzz/'  -> 3 uncovered
      #     (core/src/vfs.rs:64, :90, :91 — behind the `vfs` feature, which the
      #      existing gate never compiles, let alone measures)
      # Turning the shared gate on would therefore go red on lines no gate has
      # ever asked anyone to cover. Migrating to `coverage-gate: strict` is a
      # real coverage decision and belongs in its own PR.
      coverage-gate: "off"

  # -- carried across verbatim from the previous ci.yml ---------------------
  # Repo-specific jobs the shared workflow does not model. Unchanged, including
  # their own apt steps: qemu-utils lives HERE (coverage + corpus), not in the
  # test job, so it is deliberately not passed as `system-packages`.

  coverage:
    name: Coverage (100% production lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Install qemu-utils (feeds the reader differential coverage)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils
      - run: cargo install cargo-llvm-cov --locked
      - name: Fail on any uncovered production line (DA:n,0), honoring cov:unreachable
        run: |
          cargo llvm-cov --workspace --lcov --output-path cov.lcov
          python3 - <<'PY'
          import sys
          def marked(path, n):
              try:
                  return "cov:unreachable" in open(path).read().splitlines()[n - 1]
              except Exception:
                  return False
          cur, bad = None, []
          for line in open("cov.lcov").read().splitlines():
              if line.startswith("SF:"):
                  cur = line[3:]
              elif line.startswith("DA:") and cur:
                  if "/tests/" in cur or "/fuzz/" in cur:
                      continue  # test/fuzz scaffolding is not production
                  n, hits = line[3:].split(",")
                  if hits == "0" and not marked(cur, int(n)):
                      bad.append(f"{cur}:{n}")
          if bad:
              print("Uncovered production lines — add a test or // cov:unreachable:")
              print("\n".join(f"  {b}" for b in bad))
              sys.exit(1)
          print("100% production line coverage — no uncovered DA:n,0")
          PY

  corpus:
    name: Corpus (real-world images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Install qemu-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils
      - name: Restore corpus cache
        id: corpus-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: corpus
          key: corpus-vhd-v1
      - name: Fetch corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: bash corpus/fetch.sh
      - name: Run corpus tests
        env:
          CORPUS_DIR: ${{ github.workspace }}/corpus
        run: cargo test --test corpus -- --nocapture

  geiger:
    name: Unsafe Audit (cargo-geiger)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo install cargo-geiger --locked
      - run: cargo geiger 2>&1 || true
